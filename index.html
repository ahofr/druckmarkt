<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Druckmarkt">
<meta name="theme-color" content="#1D2521">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Druckmarkt – Markttag</title>
<style>
:root { --bg:#E7EAE4; --paper:#F6F7F3; --ink:#1D2521; --muted:#646E68; --line:#CBD1C8; --pine:#2E5B4F; --pine-soft:#D5E0DA; --gold:#B48A2C; --gold-dark:#8E6C1E; --red:#A3412C; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font: 16px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; color: var(--ink); background: var(--bg);
  padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 84px); }
header { position: sticky; top: 0; z-index: 5; background: var(--ink); color: #fff; padding: calc(env(safe-area-inset-top) + 10px) 16px 12px; margin-top: calc(-1 * env(safe-area-inset-top)); }
header .row { display: flex; align-items: center; gap: 10px; }
header h1 { font-size: 19px; margin: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
header .sub { font-size: 13px; color: #A9B3AD; margin-top: 2px; }
.back { background: none; border: 0; color: #fff; font-size: 28px; line-height: 1; padding: 0 6px 0 0; }
.mark { width: 22px; height: 22px; border-radius: 3px; background: repeating-linear-gradient(180deg, var(--gold) 0 3px, var(--gold-dark) 3px 4px); clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%); flex: none; }
.stats { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; margin-top: 12px; }
.stat { background: #26302B; border-radius: 10px; padding: 8px 10px; }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: #A9B3AD; }
.kunden { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.kunden button { width: 40px; height: 40px; border-radius: 10px; border: 0; font-size: 22px; background: #3A4640; color: #fff; }
.kunden button.plus { background: var(--gold); }
main { padding: 12px 12px 0; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
.card .info { flex: 1; min-width: 0; }
.card .name { font-weight: 600; overflow-wrap: anywhere; }
.card .var { color: var(--muted); font-size: 14px; }
.card .meta { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
.card.leer { opacity: .6; }
.card .zahl { font-size: 26px; font-weight: 700; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.minus, .plus-gross { border: 0; border-radius: 12px; font-weight: 700; }
.minus { width: 44px; height: 44px; font-size: 24px; background: #fff; border: 1px solid var(--line); color: var(--ink); }
.plus-gross { width: 64px; height: 64px; font-size: 30px; background: var(--pine); color: #fff; }
.plus-gross:active { background: #244A40; transform: scale(.96); }
.ueber { color: var(--red); font-weight: 600; }
.liste .card { cursor: pointer; }
.btn { display: block; width: 100%; padding: 14px; border-radius: 12px; border: 0; font: 600 17px inherit; font-family: inherit; text-align: center; background: var(--pine); color: #fff; }
.btn.ghost { background: transparent; color: var(--pine); border: 1px solid var(--pine); }
.btn.danger { background: transparent; color: var(--red); border: 0; font-weight: 500; }
input[type=file] { display: none; }
h2 { font-size: 17px; margin: 22px 4px 10px; }
.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
label input, label select, label textarea { display: block; width: 100%; margin-top: 4px; font: 17px -apple-system, system-ui, sans-serif; color: var(--ink); padding: 10px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
label textarea { min-height: 80px; }
.zweier { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fuss { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(env(safe-area-inset-bottom) + 10px); background: rgba(231,234,228,.95); border-top: 1px solid var(--line); z-index: 5; }
.hinweis { color: var(--muted); font-size: 14px; padding: 4px 4px 12px; }
.leerseite { text-align: center; padding: 40px 20px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 92px); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; white-space: nowrap; }
.toast.an { opacity: .95; }
.suche { width: 100%; font-size: 17px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 10px; }

/* Große Touchflächen und eine Produktgalerie für den Verkaufstisch. */
button { font-family: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #B48A2C; outline-offset: 3px; }
main { max-width: 1120px; margin: auto; }
.marktzeile { display:flex; align-items:center; justify-content:space-between; text-align:left; width:100%; border:1px solid var(--line); border-radius:14px; padding:16px; background:var(--paper); color:var(--ink); margin-bottom:10px; font-size:17px; }
.marktzeile small { display:block; color:var(--muted); margin-top:5px; line-height:1.5; }
.marktzeile b { font-size:28px; color:var(--muted); }
.mini { border:1px solid var(--pine); color:var(--pine); background:white; border-radius:9px; min-height:44px; padding:8px 12px; font-weight:600; }
.warnung { background:#fff0e8; color:#812f20; border-left:5px solid #a3412c; padding:14px; }
.anleitung { font-size:15px; line-height:1.5; }.anleitung ol { padding-left:22px; }.anleitung li { margin:8px 0; }
.tagleiste { display:flex; flex-wrap:wrap; align-items:center; gap:12px; background:#d5e0da; padding:12px 16px; border-radius:12px; }
.tagleiste label { margin:0; font-size:15px; font-weight:700; color:var(--ink); }.tagleiste select { flex:1; min-height:46px; font:600 16px inherit; font-family:inherit; padding:8px; border:1px solid #8caaa0; border-radius:9px; background:white; color:var(--ink); }
.galeriekopf { display:flex; align-items:end; justify-content:space-between; gap:8px; }.galeriekopf h2 { font-size:21px; margin-bottom:2px; }.galeriekopf p { margin:0 4px 12px; color:var(--muted); font-size:14px; }.galeriekopf>span { font-size:13px; color:var(--muted); padding-bottom:12px; white-space:nowrap; }
.galerie { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; }.produktkarte { padding:0; overflow:hidden; text-align:left; border:1px solid var(--line); border-radius:12px; background:var(--paper); color:var(--ink); }
.produktbild { display:block; width:100%; aspect-ratio:4/3; object-fit:contain; background:#fff; }.platzhalter { display:grid; place-items:center; color:#75857c; background:repeating-linear-gradient(0deg,#e1e8e2 0 3px,#d9e1db 3px 4px); }.platzhalter span { border:2px solid #91a599; padding:8px; font-weight:700; }
.produkttext { display:block; padding:12px; }.produkttext strong,.produkttext small { display:block; overflow-wrap:anywhere; }.produkttext small { color:var(--muted); margin-top:4px; }
.produktdetail { display:flex; gap:18px; align-items:center; margin:18px 0; }.produktdetail .produktbild { width:150px; flex:none; border-radius:12px; border:1px solid var(--line); }.produktdetail h2 { font-size:22px; margin:0 0 4px; }.produktdetail p { margin:3px 0; color:var(--muted); }
.varianten { display:grid; gap:8px; }.variante { display:flex; gap:14px; align-items:center; width:100%; text-align:left; color:var(--ink); background:var(--paper); border:2px solid var(--line); border-radius:12px; padding:12px; min-height:72px; font-size:17px; }.variante.gewaehlt { border-color:var(--pine); background:#e5eee8; }.vartext { flex:1; min-width:0; }.vartext strong,.vartext small { display:block; overflow-wrap:anywhere; }.vartext small { color:var(--muted); font-size:13px; margin-top:4px; }.palette { display:flex; flex-wrap:wrap; gap:3px; width:52px; flex:none; }.farbpunkt { display:block; width:24px; height:24px; border-radius:50%; border:1px solid #65726a; }.farbpunkt:only-child { width:42px; height:42px; }.farbpunkt.unbekannt { background:repeating-linear-gradient(45deg,#e6eae6 0 4px,#c5cdc6 4px 8px); }
.menge { padding:16px; margin-top:16px; border:2px solid var(--pine); border-radius:14px; background:white; }.menge h2 { margin:0; }.menge label { font-size:15px; color:var(--ink); font-weight:600; margin:0 0 5px; }.mengesteuerung { display:flex; gap:8px; }.mengesteuerung button { width:64px; min-height:60px; font-size:28px; font-weight:700; border:1px solid var(--line); border-radius:10px; background:#e9efeb; color:var(--ink); }.mengesteuerung input { min-width:0; flex:1; text-align:center; font-size:25px; font-weight:700; border:1px solid var(--line); border-radius:10px; color:var(--ink); }
@media(max-width:450px) { .stats { grid-template-columns:1fr 1fr; }.kunden { grid-column:span 2; }.galerie { grid-template-columns:repeat(2,minmax(0,1fr)); }.produktdetail .produktbild { width:100px; }.produktdetail h2 { font-size:18px; } }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="datei" accept=".json,application/json">
<script src="app.js"></script>
</body>
</html>
